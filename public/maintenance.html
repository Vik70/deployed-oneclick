<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>We'll be back soon</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #0b0c10;
        color: #e5e7eb;
      }
      .card {
        max-width: 640px;
        padding: 32px;
        border-radius: 16px;
        background: #111827;
        box-shadow: 0 10px 30px rgba(0,0,0,.35);
        text-align: center;
      }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
      p { margin: 0 0 16px; color: #cbd5e1; }
      .muted { color: #94a3b8; font-size: 14px; }
      .cta { margin-top: 8px; font-size: 14px; }
      .logo { width: 56px; height: 56px; margin: 0 auto 12px; opacity: .9; }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-label="Site maintenance notice">
      <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="#60a5fa" stroke-width="2" />
        <path d="M7 13l3 3 7-7" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>We're performing maintenance</h1>
      <p>The site is temporarily unavailable while we make some updates.</p>
      <p class="muted">Please check back soon.</p>
      <p class="cta">If you need immediate assistance, email us at <a href="mailto:info@example.com" style="color:#93c5fd">info@example.com</a>.</p>
    </main>
  </body>
  </html>
